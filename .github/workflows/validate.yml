name: Validate site

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: bundle exec bundle-audit check --update
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build:js
      - run: npm run check:js
      - run: git diff --exit-code -- assets/js/main.min.js
      - run: bundle exec jekyll build --trace
      - name: Check required output
        run: |
          for path in index.html blog/index.html publications/index.html about/index.html about.html feed.xml sitemap.xml 404.html CNAME; do
            test -s "_site/$path"
          done
          test ! -e _site/Gemfile.lock
          test ! -e _site/package-lock.json
