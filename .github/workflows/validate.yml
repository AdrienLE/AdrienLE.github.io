name: Validate site

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: bundle exec bundle-audit check --update
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build:js
      - run: npm run check:js
      - run: git diff --exit-code -- assets/js/main.min.js
      - run: bundle exec jekyll build --trace
      - name: Check required output
        run: |
          for path in index.html blog/index.html publications/index.html about/index.html about.html feed.xml sitemap.xml 404.html CNAME; do
            test -s "_site/$path"
          done
          test ! -e _site/Gemfile.lock
          test ! -e _site/package-lock.json
