name: Validate and deploy site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: 'true'
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: bundle exec bundle-audit check --update
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build:js
      - run: npm run check:js
      - run: git diff --exit-code -- assets/js/main.min.js
      - run: bundle exec jekyll build --trace
      - name: Check required output
        run: |
          for path in index.html blog/index.html publications/index.html about/index.html about.html feed.xml sitemap.xml 404.html CNAME; do
            test -s "_site/$path"
          done
          test ! -e _site/Gemfile.lock
          test ! -e _site/package-lock.json
      - name: Upload validated site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
